<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Shadowshift — Start</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 25%,#302451,#070b16 75%);color:#edf2ff;font:15px system-ui,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:12px}main{width:min(850px,100%)}h1{font-size:clamp(34px,8vw,72px);letter-spacing:5px;color:#b6a1ff;text-shadow:0 0 24px #8555ff;margin:5px 0}.gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:17px auto}.boss{background:#141c35;border:1px solid #53638d;border-radius:12px;padding:7px;min-width:0}.boss canvas{display:block;width:100%;height:auto;aspect-ratio:1/1.18;border-radius:7px}.boss b{display:block;font-size:clamp(9px,1.6vw,13px);margin-top:7px;overflow-wrap:anywhere}.boss small{color:#b4c0e5;font-size:10px}.prompt{font-size:clamp(15px,3vw,23px);color:#ffe5a1;font-weight:900;margin:12px;animation:glow 1.5s infinite alternate}@keyframes glow{from{opacity:.65}to{opacity:1;text-shadow:0 0 20px #ffc46b}}@media(max-width:480px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:10px auto}.boss{padding:4px}.boss canvas{max-height:145px;object-fit:contain}.boss b{font-size:10px}}</style><meta name="theme-color" content="#17102c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shadowshift"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon.svg"></head><body tabindex="0" role="button" aria-label="Touch anywhere or press any key to start Shadowshift"><main><div style="color:#b9a5ff;letter-spacing:3px;font-weight:800">THE AWAKENING</div><h1>SHADOWSHIFT</h1><p>40 FLOORS · FOUR MATH GUARDIANS · ONE SURVIVOR</p><div class="gallery"><div class="boss"><canvas id="boss10" width="260" height="305"></canvas><b>COUNT CRUNCHER</b><small>FLOOR 10</small></div><div class="boss"><canvas id="boss20" width="260" height="305"></canvas><b>PROFESSOR PLUS-A-SAURUS</b><small>FLOOR 20</small></div><div class="boss"><canvas id="boss30" width="260" height="305"></canvas><b>MULTIPLYING MUNCHOSAUR</b><small>FLOOR 30</small></div><div class="boss"><canvas id="boss40" width="260" height="305"></canvas><b>THE GREAT CALCULORD</b><small>FLOOR 40</small></div></div><div class="prompt">▶ TOUCH ANYWHERE OR PRESS ANY KEY TO START</div><p style="color:#aebad9;font-size:12px">Saved progress resumes automatically</p></main><script>function drawBossPortrait(canvas,boss,displayFloor=boss.floor){const g=canvas.getContext('2d'),w=canvas.width,h=canvas.height;g.clearRect(0,0,w,h);const bg=g.createRadialGradient(w/2,h*.43,15,w/2,h*.5,w*.65);bg.addColorStop(0,'#394366');bg.addColorStop(1,'#080b1c');g.fillStyle=bg;g.fillRect(0,0,w,h);g.save();g.translate(w/2,h*.56);g.shadowColor=boss.color;g.shadowBlur=28;g.strokeStyle=boss.color;g.lineWidth=6;g.fillStyle='#151b34';g.beginPath();g.ellipse(0,90,90,15,0,0,Math.PI*2);g.fill();g.beginPath();g.moveTo(-70,66);g.lineTo(-85,-35);g.lineTo(-44,-91);g.lineTo(0,-112);g.lineTo(44,-91);g.lineTo(85,-35);g.lineTo(70,66);g.closePath();g.fill();g.stroke();g.beginPath();g.moveTo(-44,-86);g.lineTo(-76,-125);g.lineTo(-27,-103);g.moveTo(44,-86);g.lineTo(76,-125);g.lineTo(27,-103);g.stroke();g.beginPath();g.moveTo(-67,25);g.lineTo(-105,75);g.moveTo(67,25);g.lineTo(105,75);g.stroke();if(boss.symbol==='×'||boss.symbol==='='){g.beginPath();g.moveTo(-54,-84);g.lineTo(-92,-117);g.lineTo(-69,-58);g.moveTo(54,-84);g.lineTo(92,-117);g.lineTo(69,-58);g.stroke()}if(boss.symbol==='='){g.fillStyle=boss.color;g.beginPath();g.moveTo(-56,-102);g.lineTo(-65,-145);g.lineTo(-25,-123);g.lineTo(0,-154);g.lineTo(25,-123);g.lineTo(65,-145);g.lineTo(56,-102);g.closePath();g.fill()}g.shadowBlur=18;g.fillStyle=boss.color;g.fillRect(-47,-41,32,14);g.fillRect(15,-41,32,14);g.fillStyle='#f6f6ff';g.font='bold 56px system-ui';g.textAlign='center';g.fillText(boss.symbol,0,39);g.restore();g.fillStyle='#e8efff';g.font='bold 13px system-ui';g.textAlign='center';g.fillText('BOSS OF FLOOR '+displayFloor,w/2,20)}
const bosses=[{"floor":10,"name":"COUNT CRUNCHER","color":"#79d9ff","symbol":"+"},{"floor":20,"name":"PROFESSOR PLUS-A-SAURUS","color":"#ff9868","symbol":"Σ"},{"floor":30,"name":"MULTIPLYING MUNCHOSAUR","color":"#c68aff","symbol":"×"},{"floor":40,"name":"THE GREAT CALCULORD","color":"#ffe07c","symbol":"="}];for(const boss of bosses)drawBossPortrait(document.getElementById('boss'+boss.floor),boss);let starting=false;function start(){if(starting)return;starting=true;location.href='./?fromSplash=1'}document.addEventListener('pointerdown',start,{once:true});document.addEventListener('keydown',e=>{e.preventDefault();start()},{once:true});</script><script>if(typeof navigator!=='undefined'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></body></html>
