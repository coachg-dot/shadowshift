name: Shadowshift smoke tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify game logic in phone and desktop modes
        run: node tests/smoke.js
      - name: Install Chromium browser test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start local game server
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/shadowshift-http.log 2>&1 &
      - name: Verify actual Chromium desktop and phone layouts
        run: node tests/browser.js
      - name: Upload desktop and phone QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadowshift-browser-screenshots
          path: test-results/
          if-no-files-found: ignore
